services:
  - type: web
    name: online-polling-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run seed:tech-polls && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://online-polling1.vercel.app
      - key: MONGO_URI
        sync: false
